name: routerec
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip=26.1
  - setuptools=75.8.2
  - wheel=0.46.3
  - pip:
      # The CUDA/PyTorch versions match the final experiment server export.
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.6.0+cu124
      - numpy==2.2.6
      - hydra-core==1.3.2
      - pyyaml==6.0.3
      - recbole==1.2.1
      - pandas==2.3.3
      - scipy==1.15.3
      - scikit-learn==1.7.2
      - tensorboard==2.20.0
      - -e .
