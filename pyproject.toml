[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "routerec"
version = "0.1.0"
description = "Behavior-guided sparse routing for sequential recommendation"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
	"pyyaml>=6.0",
	"hydra-core>=1.3,<2.0",
	"numpy>=1.24",
	"recbole==1.2.1",
	"torch>=2.0,<2.7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
