[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "routerec"
version = "0.1.0"
description = "Behavior-guided sparse routing for sequential recommendation"
readme = "README.md"
requires-python = ">=3.10,<3.12"
authors = [
    { name = "Junyeong Song", email = "jy1559@kaist.ac.kr" },
    { name = "Jaemin Yoo", email = "jaeminyoo@snu.ac.kr" },
]
license = { file = "LICENSE" }
keywords = ["recommender-systems", "sequential-recommendation", "mixture-of-experts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml>=6.0",
    "hydra-core>=1.3,<2.0",
    "numpy>=1.24",
    "recbole==1.2.1",
    "torch>=2.0,<2.7",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.urls]
Repository = "https://github.com/jy1559/RouteRec"
Issues = "https://github.com/jy1559/RouteRec/issues"

[tool.setuptools]
package-dir = {"" = "src"}
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
