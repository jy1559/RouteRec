model:
  name: RouteRec
  contract_variant: paper_full
  params:
    MAX_ITEM_LIST_LENGTH: 20
    embedding_size: 192
    hidden_size: 192
    num_heads: 4
    d_ff: 384
    d_expert_hidden: 192
    d_router_hidden: 64
    d_feat_emb: 16
    expert_scale: 3
    macro_history_window: 5
    hidden_dropout_prob: 0.15
    attn_dropout_prob: 0.10
    hidden_act: gelu
    layer_norm_eps: 1.0e-12
    loss_type: CE
    layer_layout: [attn, macro_ffn, mid_ffn, attn, micro_ffn]
    stage_router_granularity:
      macro: session
      mid: session
      micro: token
    stage_router_mode:
      macro: learned
      mid: learned
      micro: learned
    stage_compute_mode:
      macro: moe
      mid: moe
      micro: moe
    stage_feature_encoder_mode:
      macro: linear
      mid: linear
      micro: linear
    stage_feature_injection:
      macro: none
      mid: none
      micro: none
    stage_residual_mode:
      macro: base
      mid: base
      micro: base
    stage_feature_dropout_scope:
      macro: token
      mid: token
      micro: token
    stage_router_source:
      macro: both
      mid: both
      micro: both
    stage_router_wrapper:
      macro: w5_exd
      mid: w5_exd
      micro: w5_exd
    stage_router_primitives:
      macro:
        e_scalar: {source: feature, top_k: 3, temperature: 1.0}
        d_cond: {source: both, top_k: 2, temperature: 1.0}
      mid:
        e_scalar: {source: feature, top_k: 3, temperature: 1.0}
        d_cond: {source: both, top_k: 2, temperature: 1.0}
      micro:
        e_scalar: {source: feature, top_k: 3, temperature: 1.0}
        d_cond: {source: both, top_k: 2, temperature: 1.0}
    moe_top_k: 0
    moe_top_k_policy: dense
    moe_top_k_ratio: 0.5
    moe_top_k_min: 1
    moe_top_k_start: 0
    moe_top_k_warmup_until: 0
    balance_loss_lambda: 0.0
    use_aux_loss: true
    z_loss_lambda: 1.0e-4
    route_consistency_lambda: 2.5e-4
    router_impl: learned
    router_use_hidden: true
    router_use_feature: true
    router_feature_proj_dim: 0
    routerec_schedule_enable: true
    alpha_warmup_until: 0
    alpha_warmup_start: 0.0
    alpha_warmup_end: 1.0
    temperature_warmup_until: 0.3
    mid_router_temperature: 1.2
    micro_router_temperature: 1.2
    mid_router_temperature_start: 1.6
    micro_router_temperature_start: 1.6
    macro_session_pooling: mean
    stage_family_dropout_prob:
      macro: 0.02
      mid: 0.02
      micro: 0.02
    stage_feature_dropout_prob:
      macro: 0.03
      mid: 0.03
      micro: 0.03
