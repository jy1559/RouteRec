trainer:
  epochs: 25
  train_batch_size: 1024
  eval_batch_size: 2048

resources:
  timeout_minutes: 360

model:
  params:
    MAX_ITEM_LIST_LENGTH: 20
    embedding_size: 192
    hidden_size: 192
    num_heads: 8
    d_ff: 384
    d_expert_hidden: 192
    d_router_hidden: 64
    d_feat_emb: 8
    expert_scale: 3
    hidden_dropout_prob: 0.16
    attn_dropout_prob: 0.12
    route_consistency_lambda: 2.5e-4
    z_loss_lambda: 4.0e-4
    stage_feature_dropout_prob: {macro: 0.03, mid: 0.03, micro: 0.03}

provenance:
  dataset_id: retail_rocket_core5_v1
  preset_role: initialization_only
  data_note: Use the validated frozen-session core5 identity and its split fingerprint.
