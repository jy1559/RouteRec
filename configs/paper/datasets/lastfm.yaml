trainer:
  epochs: 30
  train_batch_size: 1024
  eval_batch_size: 2048

resources:
  timeout_minutes: 720

model:
  params:
    MAX_ITEM_LIST_LENGTH: 30
    embedding_size: 224
    hidden_size: 224
    num_heads: 8
    d_ff: 448
    d_expert_hidden: 224
    d_router_hidden: 96
    d_feat_emb: 12
    expert_scale: 3
    hidden_dropout_prob: 0.12
    attn_dropout_prob: 0.12
    route_consistency_lambda: 2.5e-4
    z_loss_lambda: 1.0e-4
    stage_feature_dropout_prob: {macro: 0.03, mid: 0.03, micro: 0.03}

provenance:
  dataset_id: lastfm_recovered_core5_v1
  preset_role: initialization_only
  data_note: Use the validated recovered-source core5 identity and disclose its source limits.
