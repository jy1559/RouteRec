trainer:
  epochs: 20
  train_batch_size: 2048
  eval_batch_size: 4096

resources:
  timeout_minutes: 120

model:
  params:
    MAX_ITEM_LIST_LENGTH: 20
    embedding_size: 192
    hidden_size: 192
    num_heads: 8
    d_ff: 384
    d_expert_hidden: 192
    d_router_hidden: 32
    d_feat_emb: 16
    expert_scale: 3
    hidden_dropout_prob: 0.18
    attn_dropout_prob: 0.12
    route_consistency_lambda: 2.5e-4
    z_loss_lambda: 2.0e-4
    stage_feature_dropout_prob: {macro: 0.10, mid: 0.10, micro: 0.10}

provenance:
  dataset_id: beauty_core5_v1
  preset_role: initialization_only
  data_note: Use the validated core5 identity; do not substitute another Beauty copy.
